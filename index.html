<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan 360 - Login & Register</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-icon"><i class="bi bi-bank2"></i></span>
        <span>Loan 360 <small class="text-secondary fw-normal fs-6">| Loan System</small></span>
      </a>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">


        <!-- Notification Message Banner -->
        <div id="authAlert" class="alert d-none" role="alert"></div>

        <!-- Auth Card -->
        <div class="card card-custom p-4 shadow-sm">
          <!-- Auth Tabs -->
          <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active fw-semibold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link fw-semibold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">
                <i class="bi bi-person-plus me-1"></i> Register as Borrower
              </button>
            </li>
          </ul>

          <div class="tab-content" id="authTabContent">

            <!-- SIGN IN TAB -->
            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
              <form id="loginForm">
                <div class="mb-3">
                  <label for="loginEmail" class="form-label text-secondary fw-medium">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required autocomplete="email">
                  </div>
                </div>

                <div class="mb-4">
                  <label for="loginPassword" class="form-label text-secondary fw-medium">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                  </div>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2">
                  <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
                  Sign In
                </button>
              </form>
            </div>

            <!-- REGISTER TAB (Borrowers Only) -->
            <div class="tab-pane fade" id="register-pane" role="tabpanel">
              <form id="registerForm">
                <div class="mb-3">
                  <label for="regFullName" class="form-label text-secondary fw-medium">Full Name</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="regFullName" placeholder="e.g. Ramesh Kumar" required autocomplete="name">
                  </div>
                </div>

                <div class="mb-3">
                  <label for="regEmail" class="form-label text-secondary fw-medium">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required autocomplete="email">
                  </div>
                </div>

                <div class="mb-3">
                  <label for="regPassword" class="form-label text-secondary fw-medium">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
                  </div>
                </div>

                <div class="mb-4 p-2 bg-light rounded small text-muted border">
                  <i class="bi bi-shield-check text-primary me-1"></i> Account Type: <strong class="text-dark">Borrower</strong>
                  <div class="text-secondary small mt-1">Admin access is provisioned securely via database management.</div>
                </div>

                <button type="submit" id="registerBtn" class="btn btn-primary w-100 py-2">
                  <span id="registerSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
                  Create Borrower Account
                </button>
              </form>
            </div>

          </div>
        </div>

        <!-- Quick Demo Credentials Hint -->
        <div class="text-center mt-3 text-muted small">
          <i class="bi bi-info-circle me-1"></i> <strong>Loan 360</strong>: Register above as a Borrower to apply for loans.
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-3 text-center text-muted small border-top bg-white">
    <span>Loan 360 &copy; 2026. All rights reserved.</span>
  </footer>


  <!-- Scripts -->
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application Scripts -->
  <script src="js/supabaseClient.js?v=2.2"></script>
  <script src="js/auth.js?v=2.2"></script>

  <script>
    /**
     * Displays a friendly UI alert box for errors and success messages.
     * @param {string} message - Message text
     * @param {string} type - 'danger' | 'success' | 'warning'
     */
    function showAlert(message, type = 'danger') {
      const alertBox = document.getElementById('authAlert');
      alertBox.className = `alert alert-${type}`;
      alertBox.innerHTML = message;
      alertBox.classList.remove('d-none');
    }

    /**
     * Initializes the page, checks existing session, and validates Supabase credentials.
     */
    async function initPage() {
      // Check if Supabase client is initialized
      const client = getSupabase();
      if (!client) {
        showAlert('Service unavailable. Please try again later.', 'danger');
        return;
      }

      // Check if user is already logged in
      try {
        const user = await getCurrentUser();
        if (user) {
          const profile = await getUserProfile(user.id);
          const role = profile ? profile.role : (user.user_metadata?.role || 'customer');
          redirectByRole(role);
        }
      } catch (err) {
        console.warn('Session check note:', err);
      }
    }

    // Handle Sign In Submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const spinner = document.getElementById('loginSpinner');

      try {
        btn.disabled = true;
        spinner.classList.remove('d-none');
        document.getElementById('authAlert').classList.add('d-none');

        const { user } = await signInUser(email, password);
        if (!user) throw new Error('Could not authenticate user.');

        // Fetch user role from profiles table
        const profile = await getUserProfile(user.id);
        const role = profile ? profile.role : (user.user_metadata?.role || 'customer');
        showAlert(`Login successful! Redirecting to ${role} dashboard...`, 'success');
        setTimeout(() => redirectByRole(role), 800);
      } catch (err) {
        showAlert(err.message || 'Login failed. Please check credentials.');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });

    // Handle Registration Submission (Borrower Only)
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('registerBtn');
      const spinner = document.getElementById('registerSpinner');

      try {
        btn.disabled = true;
        spinner.classList.remove('d-none');
        document.getElementById('authAlert').classList.add('d-none');

        const { user, session } = await signUpUser(email, password, fullName);

        if (session) {
          showAlert(`Borrower account registered successfully! Redirecting...`, 'success');
          setTimeout(() => redirectByRole('customer'), 1000);
        } else {
          showAlert('Registration successful! Please check your email if confirmation is enabled, or proceed to Sign In.', 'info');
          // Switch to login tab
          const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));
          loginTab.show();
          document.getElementById('loginEmail').value = email;
        }
      } catch (err) {
        showAlert(err.message || 'Registration failed.');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
